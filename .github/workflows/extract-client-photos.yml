name: Extract client photo assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    if: ${{ github.event.head_commit.message != 'Extract client photo assets' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract optimized client photos
        run: |
          if [ -f "assets/kaalaverse-client-photos-assets.zip" ]; then
            unzip -o assets/kaalaverse-client-photos-assets.zip -d /tmp/kaalaverse-photos
            find /tmp/kaalaverse-photos -type f \\( -iname '*.jpg' -o -iname '*.jpeg' \\) -exec cp {} assets/ \;
          fi
          if [ -f "assets/kaalaverse-batch1-assets (5).zip" ]; then
            unzip -o "assets/kaalaverse-batch1-assets (5).zip" -d /tmp/kaalaverse-batch1
            find /tmp/kaalaverse-batch1 -type f -iname '*.webp' -exec cp {} assets/ \;
            cp /tmp/kaalaverse-batch1/kaalaverse_batch1/artworks.csv assets/kaalaverse-batch1-artworks.csv
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.jpg assets/*.jpeg assets/*.webp assets/kaalaverse-batch1-artworks.csv
          git commit -m "Extract client photo assets" || exit 0
          git push
